[package]
name = "duplix"
version = "0.1.0"
edition = "2021"
description = "CLI minimalista para detectar y mover archivos duplicados"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jwalk = "0.8"
rayon = "1.10"
blake3 = "1.5"
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
ratatui = "0.29"
crossterm = "0.28"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.10"
